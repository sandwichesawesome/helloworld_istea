# Cloud Run 은 컨테이너의 8080 포트로 요청을 보낸다.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 한글 제목이 링크 미리보기(카카오톡 등)에서 깨지지 않도록 헤더에도 UTF-8 명시
  charset utf-8;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

  # 파일 이름에 해시가 붙는 빌드 결과(JS/CSS): 1년 캐시
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # index.html · 아이콘 등: 매번 새 버전인지 확인 (배포 직후 바로 반영)
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
